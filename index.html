<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lustra: see how it really fits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C8102E;
    --ink: #141414;
    --paper: #FAF8F5;
    --line: #E8E2DA;
    --tint: #FFE3E8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--red);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; width: 100%; }

  header { background: var(--paper); border-bottom: 1px solid var(--line); }
  header .wrap { padding-top: 18px; padding-bottom: 18px; }
  header img { height: 44px; width: auto; display: block; }

  .hero { background: var(--red); color: #fff; flex: 1; }
  .hero .wrap { padding-top: clamp(160px, 18vw, 240px); padding-bottom: 96px; }
  .hero-inner { max-width: 760px; display: flex; flex-direction: column; gap: 24px; }
  .eyebrow {
    margin: 0; font-size: 14px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--tint);
  }
  h1 {
    margin: 0; font-family: Gloock, Georgia, serif; font-weight: 400;
    font-size: clamp(36px, 5vw, 64px); line-height: 1.02; letter-spacing: -0.01em;
  }
  .lede { margin: 0; font-size: clamp(18px, 2vw, 21px); line-height: 1.55; max-width: 34em; color: #FFF4F6; }

  form { display: flex; flex-wrap: wrap; gap: 12px; max-width: 660px; margin-top: 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  input[type=email] {
    flex: 1 1 260px; min-width: 0; min-height: 56px; padding: 0 22px;
    border: 0; border-radius: 999px; font: inherit; font-size: 17px; color: var(--ink); background: #fff;
  }
  input[type=email]::placeholder { color: #6B6560; }
  input[type=email]:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button {
    min-height: 56px; padding: 0 30px; border: 0; border-radius: 999px;
    background: var(--ink); color: #fff; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer;
  }
  button:hover { background: #2A2A2A; }
  button[disabled] { opacity: 0.7; cursor: default; }
  .msg { margin: 0; font-size: 15px; min-height: 1.4em; color: #fff; }
  .thanks {
    margin: 8px 0 0; padding: 18px 22px; border-radius: 18px; max-width: 660px;
    background: #fff; color: var(--ink); font-size: 17px; font-weight: 600; line-height: 1.5;
  }

  footer { background: var(--ink); color: var(--paper); }
  footer .wrap {
    padding-top: 28px; padding-bottom: 28px;
    display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center;
    font-size: 15px;
  }
  footer a { color: var(--paper); text-decoration: underline; text-underline-offset: 3px; }
  footer a:hover { color: var(--tint); }
  footer .copy { color: #BDB6AE; }
</style>
</head>

      <p class="eyebrow">A virtual mirror for online shopping</p>
      <h1>See how it really fits, before you buy.</h1>

      <form id="signup" novalidate>
        <label for="email" class="sr-only">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <button type="submit">Join the beta</button>
      </form>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </div>

<script>
  /* ------------------------------------------------------------------
     CONNECT THE SIGN-UP TO A GOOGLE FORM (optional but recommended)
     1. Make a Google Form with one "Short answer" question: Email.
     2. In the form, open the three-dot menu > "Get pre-filled link",
        type test@test.com, click "Get link" and copy it.
     3. From that link, paste the long ID after /d/e/ into FORM_ID,
        and the number after "entry." into EMAIL_ENTRY.
     Leave them empty and the page still works, but emails are not saved.
  ------------------------------------------------------------------ */
  var FORM_ID = "";       // e.g. "1FAIpQLSc...xyz"
  var EMAIL_ENTRY = "";   // e.g. "1234567890"

  document.getElementById('year').textContent = new Date().getFullYear();

  var form = document.getElementById('signup');
  var input = document.getElementById('email');
  var msg = document.getElementById('msg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      msg.textContent = 'Please enter a valid email address.';
      input.focus();
      return;
    }
    var btn = form.querySelector('button');
    btn.disabled = true;
    msg.textContent = '';

    function done() {
      var p = document.createElement('p');
      p.className = 'thanks';
      p.textContent = 'Thank you. You are on the list, and we will be in touch when the beta opens.';
      form.replaceWith(p);
    }

    if (FORM_ID && EMAIL_ENTRY) {
      var body = new URLSearchParams();
      body.append('entry.' + EMAIL_ENTRY, email);
      fetch('https://docs.google.com/forms/d/e/' + FORM_ID + '/formResponse', {
        method: 'POST', mode: 'no-cors', body: body
      }).then(done).catch(function () {
        btn.disabled = false;
        msg.textContent = 'Something went wrong. Please try again, or email info@lustralabs.ai.';
      });
    } else {
      done();
    }
  });
</script>
